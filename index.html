<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Todo List</title><script defer src=main.js></script></head><body><aside><div class=projects><h2>Projects</h2><ul id=project-list></ul><button type=button id=collapse-add-project>Add Project</button><div class=project-form-content><form id=new-project-form><label for=project-input>Project Name</label> <input id=project-input name=project-name required> <button type=submit>Submit</button></form></div></div></aside><main><div class=container><header><h1 id=active-project-title>Default Project</h1></header><button type=button id=collapse-add-todo>Add Task</button><div class=todo-form-content><form id=new-todo-form><label for=todo-title>Task Title</label> <input id=todo-title name=todo-title required> <label for=todo-description>Description</label> <textarea type=textarea name=todo-description id=todo-description></textarea> <label for=todo-date>Due Date</label> <input type=date id=todo-date name=todo-date> <label for=todo-priority>Priority</label> <select name=todo-priority id=todo-priority><option value=Low>Low<option value=Medium>Medium<option value=High>High</select> <button type=submit>Submit</button></form></div><div class=content-list><p id=task-column>Task<p id=description-column>Description<p id=date-column>Due Date<p id=priority-column>Priority<div id=todo-list></div></div></div></main></body></html>
