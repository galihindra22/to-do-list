<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <aside>
        <div class="projects">
            <h2>Projects</h2>
            <ul id="project-list"></ul>
            <form id="new-project-form">
                <label for="project-input">Project Name</label>
                <input type="text" id="project-input" name="project-name" required>
                <button type="submit">Add Project</button>
            </form>
        </div>
    </aside>
    <main>
        <div class="container">
            <header>
                <h1>Default Project</h1>
            </header>
            <div class="todo-list"></div>

            <form id="new-todo-form">
                <label for="todo-title">Todo Title</label>
                <input type="text" id="todo-title" name="todo-title" required>
                <label for="todo-description">Description</label>
                <textarea type="textarea" name="todo-description" id="todo-description" required></textarea>
                <label for="todo-date">Due Date</label>
                <input type="date" id="todo-date" name="todo-date">
                <select name="todo-priority" id="todo-priority">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
                <button type="submit">Add Task</button>
            </form>
        </div>
        
    </main>
</body>
</html>
